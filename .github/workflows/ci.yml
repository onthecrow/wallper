# Every pull request and push to main: the unit tests of all modules, lint, an R8 release build and the
# offline compile of the black hole shaders. The release build here is unsigned: the upload key never
# leaves the developer's machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # glslangValidator checks the shaders as `#version 300 es`, exactly as the devices compile them.
      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Unit tests, lint, release build, shaders
        env:
          WALLPER_REQUIRE_SHADER_COMPILER: "true"
        run: ./gradlew unitTest lintDebug assembleRelease validateBlackHoleShaders --stacktrace
